            inkpi/pnpm-lock.yaml
            inkpi-desktop/pnpm-lock.yaml

      - name: Install Runtime dependencies
        run: pnpm --dir inkpi install --frozen-lockfile --ignore-scripts

      - name: Build Runtime packages
        run: pnpm --dir inkpi run build

      - name: Runtime cross-boundary governance
        run: >-
          pnpm --dir inkpi exec vitest run
          tests/ai-runtime-architecture.test.ts
          tests/final-freeze-cross-boundary.test.ts
          tests/runtime-boundary-governance.test.ts
          tests/phase22-reliability-matrix.test.ts

      - name: Install Desktop dependencies
        run: pnpm --dir inkpi-desktop install --frozen-lockfile --ignore-scripts

      - name: Run Desktop test shard
        run: pnpm --dir inkpi-desktop exec vitest run --shard=${{ matrix.shard }}/4

