name: Desktop Release & Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - name: Checkout Desktop Repository
        uses: actions/checkout@v4
        with:
          path: inkpi-desktop

      - name: Checkout Upstream InkPi Monorepo
        uses: actions/checkout@v4
        with:
          repository: MeiSiristhebest/inkpi
          path: inkpi

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Corepack & Setup pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Compile InkPi Daemon Standalone Binary
        working-directory: inkpi
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts
          pnpm run build
          pnpm run build:binaries

      - name: Install Desktop Dependencies & Sync Sidecar
        working-directory: inkpi-desktop
        run: |
          npm install --ignore-scripts
          node scripts/copy-daemon-sidecar.mjs

      - name: Build Web Application
        working-directory: inkpi-desktop
        run: npm run build

      - name: Run Test Coverage Gate
        working-directory: inkpi-desktop
        run: npm run test:coverage

      - name: Build Tauri Desktop Package
        working-directory: inkpi-desktop
        run: npx tauri build

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inkpi-desktop-${{ matrix.os }}
          path: inkpi-desktop/src-tauri/target/release/bundle/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: inkpi-desktop/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
