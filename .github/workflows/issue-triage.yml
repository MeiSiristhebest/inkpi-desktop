name: Issue & Community Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: Automatic Desktop Triage & Labeling
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Analyze and Label Issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = (issue.title || '').toLowerCase();
            const body = (issue.body || '').toLowerCase();

            const labelsToAdd = [];

            const isBug =
              title.includes('bug') ||
              title.includes('crash') ||
              title.includes('freeze') ||
              body.includes('error');
            if (isBug) {
              labelsToAdd.push('bug');
            }

            const isFeat =
              title.includes('feat') ||
              title.includes('add') ||
              body.includes('proposal');
            if (isFeat) {
              labelsToAdd.push('enhancement');
            }

            const isTauri =
              body.includes('tauri') ||
              body.includes('rust') ||
              body.includes('window');
            if (isTauri) {
              labelsToAdd.push('area:tauri-rust');
            }

            const isEditor =
              body.includes('editor') ||
              body.includes('rich') ||
              body.includes('typewriter');
            if (isEditor) {
              labelsToAdd.push('area:editor');
            }

            const isPlugin =
              body.includes('plugin') ||
              body.includes('drawer') ||
              body.includes('panel');
            if (isPlugin) {
              labelsToAdd.push('area:plugins');
            }

            if (labelsToAdd.length === 0) {
              labelsToAdd.push('needs-triage');
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: labelsToAdd
            });

            const welcomeComment = [
              'Thank you for reporting this issue to InkPi Desktop!',
              'Our desktop client and UI engineering team has been notified.'
            ].join(' ');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: welcomeComment
            });
