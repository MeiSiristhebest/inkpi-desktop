---
name: Tauri Rust Backend Check

on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - '.github/workflows/tauri-rust-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Rust Clippy & Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Desktop Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies for Tauri
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cargo Format Check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Cargo Check
        working-directory: src-tauri
        run: cargo check
...
