name: CI

on:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Desktop Frontend Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x]

    steps:
      - name: Checkout Desktop Repository
        uses: actions/checkout@v4
        with:
          path: inkpi-desktop

      - name: Checkout Upstream InkPi Monorepo
        uses: actions/checkout@v4
        with:
          repository: MeiSiristhebest/inkpi
          path: inkpi

      - name: Enable Corepack & Setup pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Setup Node.js ${{ matrix.node-version }} with Cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: inkpi-desktop/package-lock.json

      - name: Build InkPi Monorepo Packages
        working-directory: inkpi
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts
          pnpm run build

      - name: Install Desktop Dependencies
        working-directory: inkpi-desktop
        run: npm install --ignore-scripts

      - name: Lint Check (Oxlint)
        working-directory: inkpi-desktop
        run: npm run lint

      - name: TypeScript Typecheck & Vite Build
        working-directory: inkpi-desktop
        run: npm run build

      - name: Run Test Coverage & Thresholds
        working-directory: inkpi-desktop
        run: npm run test:coverage
